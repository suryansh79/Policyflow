version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: policyflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: policyflow
      MYSQL_USER: policyflow
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - policyflow

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: policyflow-app
    container_name: policyflow-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PHP_CLI_SERVER_WORKERS=4
    networks:
      - policyflow

volumes:
  mysql_data:

networks:
  policyflow:
    driver: bridge
